function deepCopy(x){return JSON.parse(JSON.stringify(x));}
function loadDb(){try{let p=JSON.parse(localStorage.getItem(STORAGE_KEY));if(p&&Array.isArray(p.companies)&&Array.isArray(p.entries))return p;}catch(e){console.warn(e);}return deepCopy(INITIAL);}

const money=n=>Number(n||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'});
const shortDate=s=>{if(!s)return '—';let m=String(s).match(/^(\d{4})-(\d{2})-(\d{2})$/);return m?`${m[3]}/${m[2]}/${m[1]}`:'—'};
const todayISO=()=>{let d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`};
function showToast(msg,kind='success'){let node=el('toast');node.textContent=msg;node.className='toast show'+(kind==='error'?' error':kind==='warning'?' warning':'');clearTimeout(toastTimer);toastTimer=setTimeout(()=>node.className='toast',3700);}
function saveDb(){try{localStorage.setItem(STORAGE_KEY,JSON.stringify(db));return true;}catch(e){showToast('O armazenamento do navegador está cheio ou bloqueado. Exporte uma cópia dos dados.','error');return false;}}
function uid(){return typeof crypto!=='undefined'&&crypto.randomUUID?crypto.randomUUID():`ID-${Date.now()}-${Math.random().toString(16).slice(2)}`;}
const CATEGORY_ALIASES={'Salários':'Pagamento de funcionários (salários)','Pagamento de funcionários':'Pagamento de funcionários (salários)'};
function catByName(n){return CATEGORIES.find(c=>c.nome===(CATEGORY_ALIASES[n]||n));}
function companyByCode(c){return db.companies.find(x=>x.code===c);}
function valueNumber(v){if(typeof v==='number')return Number.isFinite(v)?v:NaN;if(typeof v!=='string')return NaN;let s=v.trim().replace(/\s/g,'').replace(/^R\$/i,'');if(!s)return NaN;if(s.includes(',')&&s.includes('.'))s=s.replace(/\./g,'').replace(',','.');else if(s.includes(','))s=s.replace(',','.');if(!/^\d+(\.\d+)?$/.test(s))return NaN;return Number(s);}
function isDateISO(v){let m=String(v||'').match(/^(\d{4})-(\d{2})-(\d{2})$/);if(!m)return false;let d=new Date(Date.UTC(+m[1],+m[2]-1,+m[3]));return d.getUTCFullYear()===+m[1]&&d.getUTCMonth()===+m[2]-1&&d.getUTCDate()===+m[3]};
function dateFromText(s){if(!s&&s!==0)return '';if(typeof s==='number'){if(!Number.isFinite(s)||s<1||s>2958465)return '';let d=new Date(Date.UTC(1899,11,30)+Math.round(s*86400000));return Number.isNaN(d.getTime())?'':d.toISOString().slice(0,10)}let text=String(s).trim();if(isDateISO(text))return text;let a=text.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})$/);if(a){let iso=`${a[3]}-${a[2].padStart(2,'0')}-${a[1].padStart(2,'0')}`;return isDateISO(iso)?iso:''}return ''}
function isOperationalRevenue(e){return catByName(e.category)?.grupo==='Receitas'}
function calculateStats(entries=db.entries){let received=0,paid=0,receivable=0,payable=0,revenue=0;for(let e of entries){let cat=catByName(e.category);if(!cat)continue;let inc=cat.natureza==='ENTRADA';if(e.situacao==='LIQUIDADO'){if(inc)received+=e.valor;else paid+=e.valor;if(inc&&isOperationalRevenue(e))revenue+=e.valor;}else{if(inc)receivable+=e.valor;else payable+=e.valor;}}return{received,paid,receivable,payable,balance:received-paid,revenue};}

const actionImport=`<button class="btn" data-page="import">${icon('import')} Importar Excel</button>`;
function kpi(label,value,sub,emo){return `<div class="kpi"><div class="kpi-top"><span class="kpi-label">${label}</span><span class="kpi-icon">${emo}</span></div><div class="kpi-val">${money(value)}</div><div class="kpi-note">${sub}</div></div>`}
function monthlyChart(){let now=new Date(),months=[];for(let i=5;i>=0;i--){let d=new Date(now.getFullYear(),now.getMonth()-i,1);let key=`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`;months.push({key,label:d.toLocaleDateString('pt-BR',{month:'short'}).replace('.',''),in:0,out:0})}for(let e of db.entries){if(e.situacao!=='LIQUIDADO')continue;let m=months.find(x=>x.key===String(e.data_liquidacao).slice(0,7));if(!m)continue;(catByName(e.category)?.natureza==='ENTRADA'?m.in+=e.valor:m.out+=e.valor)}let max=Math.max(1,...months.flatMap(x=>[x.in,x.out]));let width=560,height=190,baseline=152,barW=18,slot=84,start=28,scale=120/max;let bars=months.map((m,i)=>{let x=start+i*slot;let h1=m.in*scale,h2=m.out*scale;return `<rect x="${x}" y="${baseline-h1}" width="${barW}" height="${Math.max(1,h1)}" rx="3" fill="#138563"><title>${es(m.label)} • entradas: ${money(m.in)}</title></rect><rect x="${x+22}" y="${baseline-h2}" width="${barW}" height="${Math.max(1,h2)}" rx="3" fill="#e4b16e"><title>${es(m.label)} • saídas: ${money(m.out)}</title></rect><text x="${x+19}" y="177" text-anchor="middle" class="bar-label">${es(m.label)}</text>`}).join('');return `<div class="chart-wrap"><svg viewBox="0 0 ${width} ${height}" role="img" aria-label="Gráfico de entradas e saídas dos últimos seis meses"><line x1="15" y1="152" x2="550" y2="152" stroke="#e0ebe4"/><line x1="15" y1="92" x2="550" y2="92" stroke="#eef2ef" stroke-dasharray="3 5"/><line x1="15" y1="32" x2="550" y2="32" stroke="#eef2ef" stroke-dasharray="3 5"/>${bars}</svg><div class="legend"><span><i style="background:#138563"></i>Entradas</span><span><i style="background:#e4b16e"></i>Saídas</span></div></div>`}
function entryCompany(e){return companyByCode(e.empresa_codigo)?.name||e.empresa_codigo}
function renderDashboard(){let s=calculateStats(),latest=[...db.entries].sort((a,b)=>String(b.createdAt||'').localeCompare(String(a.createdAt||''))).slice(0,6);return pageHead('Área de trabalho','Visão geral','Acompanhe os resultados das empresas cadastradas.',actionImport+actionAdd)+`<div class="warning-bar">ⓘ <span>Modo de teste local: as informações são guardadas apenas neste navegador. Não use dados financeiros reais ou sensíveis nesta versão.</span></div><div class="grid-kpis">${kpi('Saldo realizado',s.balance,'Entradas menos saídas liquidadas','◈')}${kpi('Entradas recebidas',s.received,'Inclui aportes e empréstimos','↗')}${kpi('Saídas pagas',s.paid,'Movimentações liquidadas','↘')}${kpi('A receber',s.receivable,'Lançamentos pendentes de entrada','◷')}</div><div class="two-panels"><section class="panel"><div class="panel-header"><div><h2>Fluxo de caixa</h2><small>Últimos 6 meses, por data de liquidação</small></div></div>${monthlyChart()}</section><section class="panel"><div class="panel-header"><div><h2>Resumo financeiro</h2><small>Todos os lançamentos salvos</small></div></div><div class="panel-pad"><div class="statusline"><span>Receita operacional recebida</span><strong>${money(s.revenue)}</strong></div><div class="statusline"><span>Contas a pagar</span><strong>${money(s.payable)}</strong></div><div class="statusline"><span>Empresas cadastradas</span><strong>${db.companies.length}</strong></div><div class="statusline"><span>Lançamentos</span><strong>${db.entries.length}</strong></div><div class="info-line">Aportes e empréstimos recebidos entram no caixa, mas não são faturamento operacional.</div></div></section></div><section class="panel section-space"><div class="panel-header"><h2>Últimos lançamentos</h2><button class="text-btn" data-page="entries">Ver todos ${icon('arrow')}</button></div>${latest.length?`<div class="mini-list">${latest.map(e=>`<div class="mini-row"><div class="mini-row-main"><strong>${es(e.descricao)}</strong><small>${es(entryCompany(e))} · ${es(e.categoria)} · ${shortDate(e.data_vencimento)}</small></div><div class="center-row"><span class="status ${e.situacao==='LIQUIDADO'?'paid':'pending'}">${e.situacao==='LIQUIDADO'?'Liquidado':'Pendente'}</span><span class="money ${catByName(e.categoria)?.natureza==='ENTRADA'?'plus':'minus'}">${catByName(e.categoria)?.natureza==='ENTRADA'?'+':'−'} ${money(e.valor)}</span></div></div>`).join('')}</div>`:`<div class="empty-state"><div class="big-icon">▤</div><h3>Seu painel está pronto!</h3><p>Cadastre um lançamento manual ou importe o Excel de teste para começar.</p><button class="btn btn-primary" data-page="add">${icon('add')} Cadastrar primeiro lançamento</button></div>`}</section><div class="footer-note">Prosperium Gestão · Ambiente demonstrativo local · Versão 1.0</div>`}
function listEntries(){let filtered=db.entries.filter(e=>{if(queryState.company&&e.empresa_codigo!==queryState.company)return false;if(queryState.status&&e.situacao!==queryState.status)return false;if(queryState.group&&catByName(e.categoria)?.grupo!==queryState.group)return false;if(queryState.q&&!`${e.descricao} ${e.documento} ${e.categoria} ${e.id_externo||''}`.toLowerCase().includes(queryState.q.toLowerCase()))return false;return true;});return filtered.sort((a,b)=>b.data_vencimento.localeCompare(a.data_vencimento)||String(b.createdAt||'').localeCompare(String(a.createdAt||'')));}
function companyOptions(selected='',placeholder='Todas as empresas'){return `<option value="">${es(placeholder)}</option>`+db.companies.map(c=>`<option value="${es(c.code)}" ${c.code===selected?'selected':''}>${es(c.name)} (${es(c.code)})</option>`).join('')}
function listTable(entries,preview=false){if(!entries.length)return `<div class="empty-state"><div class="big-icon">▤</div><h3>Nenhum lançamento encontrado</h3><p>Cadastre um novo lançamento ou altere os filtros.</p><button data-page="add" class="btn btn-primary">${icon('add')} Novo lançamento</button></div>`;return `<div class="table-scroll"><table><thead><tr><th>Descrição / Documento</th><th>Empresa</th><th>Categoria</th><th>Vencimento</th><th>Situação</th><th>Valor</th><th>Ações</th></tr></thead><tbody>${entries.map(e=>`<tr><td><strong>${es(e.descricao)}</strong><small>${es(e.documento||e.id_externo||'Sem documento')}</small></td><td>${es(e.empresa_codigo)}<small>${es(entryCompany(e))}</small></td><td>${es(e.categoria)}<small>${es(catByName(e.categoria)?.grupo||'')}</small></td><td>${shortDate(e.data_vencimento)}</td><td><span class="status ${e.situacao==='LIQUIDADO'?'paid':'pending'}">${e.situacao==='LIQUIDADO'?'Liquidado':'Pendente'}</span></td><td><span class="money ${catByName(e.categoria)?.natureza==='ENTRADA'?'plus':'minus'}">${money(e.valor)}</span></td><td><div class="row-actions"><button class="text-btn" data-edit="${es(e.id)}">Editar</button><button class="text-btn" style="color:#b04743" data-delete="${es(e.id)}">Excluir</button></div></td></tr>`).join('')}</tbody></table></div>`}
function renderEntries(){let entries=listEntries();return pageHead('Operações financeiras','Lançamentos','Consulte, edite ou exclua as movimentações registradas.',actionImport+actionAdd)+`<div class="panel"><div class="panel-pad"><div class="filters"><input class="control filter-input" id="f-q" placeholder="Buscar descrição ou documento" value="${es(queryState.q)}" aria-label="Buscar lançamentos"><select class="control filter-select" id="f-company">${companyOptions(queryState.company)}</select><select class="control filter-select" id="f-status"><option value="">Todas as situações</option><option value="PENDENTE" ${queryState.status==='PENDENTE'?'selected':''}>Pendente</option><option value="LIQUIDADO" ${queryState.status==='LIQUIDADO'?'selected':''}>Liquidado</option></select><select class="control filter-select" id="f-group"><option value="">Todos os grupos</option>${[...new Set(CATEGORIES.map(x=>x.grupo))].map(g=>`<option ${queryState.group===g?'selected':''}>${es(g)}</option>`).join('')}</select></div><div class="mini-summary"><span class="header-meta" id="entry-count">${entries.length} lançamento(s)</span><button class="btn btn-sm" data-action="export-csv">Exportar CSV</button></div></div><div id="entry-table">${listTable(entries)}</div></div><p class="tipline">Regra: lançamentos pendentes não alteram o saldo realizado. Os dados são mantidos somente neste navegador.</p>`}
function optionCategories(selected=''){let groups=[...new Set(CATEGORIES.map(c=>c.grupo))];return `<option value="">Selecione uma categoria</option>`+groups.map(g=>`<optgroup label="${es(g)}">${CATEGORIES.filter(c=>c.grupo===g).map(c=>`<option value="${es(c.nome)}" ${selected===c.nome?'selected':''}>${es(c.nome)}</option>`).join('')}</optgroup>`).join('')}
function formField(label,name,value='',type='text',required=false,extra=''){return `<div class="field"><label for="m-${name}">${label}${required?' <span style="color:#c46e54">*</span>':''}</label><input class="control" id="m-${name}" name="${name}" type="${type}" value="${es(value)}" ${required?'required':''} ${extra}></div>`}
function renderAdd(){let e=db.entries.find(x=>x.id===selectedEdit)||{};let cat=catByName(e.categoria);return pageHead('Movimentações',selectedEdit?'Editar lançamento':'Novo lançamento','Preencha os dados para registrar uma entrada ou saída financeira.',`<button class="btn" data-page="entries">← Voltar aos lançamentos</button>`)+`<div class="form-shell"><section class="panel panel-pad"><form id="entry-form"><div class="form-grid"><div class="field span2"><label for="m-company">Empresa <span style="color:#c46e54">*</span></label><select class="control" required id="m-company" name="empresa_codigo">${companyOptions(e.empresa_codigo||'', 'Selecione a empresa')}</select></div><div class="field span2"><label for="m-desc">Descrição do lançamento <span style="color:#c46e54">*</span></label><input class="control" maxlength="200" minlength="3" required id="m-desc" name="descricao" placeholder="Ex.: Conta de energia - novembro" value="${es(e.descricao||'')}"></div><div class="field"><label for="m-cat">Categoria <span style="color:#c46e54">*</span></label><select class="control" required id="m-cat" name="categoria">${optionCategories(e.categoria)}</select></div>${formField('Valor (R$)','valor',e.valor===undefined?'':String(e.valor).replace('.',','),'text',true,'inputmode="decimal" placeholder="Ex.: 275,49" maxlength="18"')}${formField('Data de vencimento','data_vencimento',e.data_vencimento||todayISO(),'date',true)}<div class="field"><label for="m-status">Situação <span style="color:#c46e54">*</span></label><select class="control" id="m-status" name="situacao"><option value="PENDENTE" ${e.situacao!=='LIQUIDADO'?'selected':''}>Pendente</option><option value="LIQUIDADO" ${e.situacao==='LIQUIDADO'?'selected':''}>Liquidado</option></select></div><div id="liquidate-wrap" class="field ${e.situacao==='LIQUIDADO'?'':'hide'}">${formField('Data da liquidação','data_liquidacao',e.data_liquidacao||'','date',e.situacao==='LIQUIDADO')}</div>${formField('Data de competência','data_competencia',e.data_competencia||'','date',false)}${formField('Documento','documento',e.documento||'','text',false,'maxlength="50" placeholder="Ex.: FAT-100"')}<div class="field span2"><label for="m-notes">Observações</label><textarea class="control" id="m-notes" name="observacoes" rows="3" maxlength="500" placeholder="Informações adicionais (opcional)">${es(e.observacoes||'')}</textarea><span class="hint">O ID interno é gerado automaticamente no cadastro manual.</span></div></div><div class="form-footer"><button class="btn btn-primary" type="submit">${selectedEdit?'Salvar alterações':'Salvar lançamento'}</button><button class="btn" type="button" data-page="entries">Cancelar</button></div></form></section><aside><div class="panel aside-note"><div class="mini-indicator">◈</div><h3 class="margin-top">Classificação automática</h3><p>Ao selecionar uma categoria, o sistema identifica o grupo financeiro e a natureza de caixa da movimentação.</p><div class="context-block" id="cat-summary"><strong>${es(cat?.grupo||'Selecione uma categoria')}</strong><small>${es(cat?.natureza==='ENTRADA'?'Entrada de caixa':cat?'Saída de caixa':'O grupo e a natureza aparecem aqui.')}</small></div><p>Para lançamentos <strong>liquidados</strong>, a data da liquidação é obrigatória. Para pendentes, ela fica vazia.</p></div><div class="notice blue section-space">Para importar vários lançamentos de uma vez, use a aba <strong>Importar Excel</strong>. O cadastro manual e a planilha seguem as mesmas regras.</div></aside></div>`}
function validateEntry(raw,mode='manual'){
 const errors=[];
 const e={...raw};
 for(let k of ['empresa_codigo','descricao','categoria','situacao','documento','observacoes','id_externo'])if(e[k]!==undefined&&e[k]!==null)e[k]=String(e[k]).trim();
 if(mode==='import'){if(!e.id_externo||e.id_externo.length>40)errors.push('id_externo é obrigatório (até 40 caracteres).');}
 if(!e.empresa_codigo||e.empresa_codigo.length>30||!companyByCode(e.empresa_codigo))errors.push('Código da empresa não cadastrado.');
 if(!e.descricao||e.descricao.length<3||e.descricao.length>200)errors.push('Descrição deve conter de 3 a 200 caracteres.');
 let recognizedCategory=catByName(e.categoria);if(!recognizedCategory)errors.push('Categoria não está na lista oficial.');else e.categoria=recognizedCategory.nome;
 if(mode==='import'&&typeof e.valor!=='number')errors.push('Valor deve ser uma célula numérica do Excel.');
 e.valor=valueNumber(e.valor);if(!Number.isFinite(e.valor)||e.valor<=0||e.valor>1e12)errors.push('Valor precisa ser positivo e numérico.');
 for(let k of ['data_vencimento','data_liquidacao','data_competencia'])e[k]=dateFromText(e[k]);
 if(!e.data_vencimento)errors.push('Data de vencimento inválida ou vazia.');
 if(!['LIQUIDADO','PENDENTE'].includes(e.situacao))errors.push('Situação deve ser PENDENTE ou LIQUIDADO.');
 if(e.situacao==='LIQUIDADO'&&!e.data_liquidacao)errors.push('Informe a data da liquidação.');
 if(e.situacao==='PENDENTE'&&e.data_liquidacao)errors.push('Pendente não pode ter data de liquidação.');
 if(e.documento?.length>50)errors.push('Documento excede 50 caracteres.');
 if(e.observacoes?.length>500)errors.push('Observações excedem 500 caracteres.');
 if(!e.data_competencia)e.data_competencia=e.data_vencimento;
 return{data:e,errors};
}
function saveEntryFromForm(f){let fd=new FormData(f);let raw={};for(let [k,v] of fd.entries())raw[k]=v;raw.situacao=raw.situacao||'PENDENTE';raw.data_liquidacao=raw.situacao==='PENDENTE'?'':raw.data_liquidacao;
 let {data,errors}=validateEntry(raw);if(errors.length){showToast(errors[0],'error');return;}if(selectedEdit){let at=db.entries.findIndex(x=>x.id===selectedEdit);if(at<0)return;let old=db.entries[at];db.entries[at]={...old,...data,modifiedAt:new Date().toISOString()};}else{db.entries.unshift({...data,id:uid(),id_externo:null,origin:'MANUAL',createdAt:new Date().toISOString()});}if(saveDb()){showToast(selectedEdit?'Lançamento atualizado.':'Lançamento cadastrado com sucesso!');selectedEdit=null;navigate('entries');}}
function renderImport(){let state=importSession;return pageHead('Entrada de dados','Importar lançamentos do Excel','Carregue a planilha padrão, confira as linhas e confirme somente os registros válidos.',`<button class="btn" data-action="download-template">${icon('import')} Baixar modelo .xlsx</button>`)+`<div class="warning-bar">ⓘ <span>O importador lê <strong>somente</strong> a aba <strong>IMPORTAR_LANCAMENTOS</strong>. Não importa os exemplos automaticamente. Máximo de 5.000 linhas por arquivo.</span></div><div class="panel panel-pad"><div class="upload" id="drop-zone"><div class="upload-ic">▤</div><h3>Selecione um arquivo Excel</h3><p>Arraste seu arquivo para cá ou clique no botão abaixo.<br>Formato aceito: .xlsx · Até 10 MB</p><label class="btn btn-primary" for="excel-file">Escolher arquivo .xlsx</label><input type="file" accept=".xlsx" id="excel-file" class="hide"><span class="file-small" id="file-selected">${state?es(state.fileName):'Nenhum arquivo selecionado'}</span></div><div class="help-rows section-space"><div><strong>1. Preencha</strong><span>Adicione os lançamentos na aba IMPORTAR_LANCAMENTOS; uma linha por registro.</span></div><div><strong>2. Valide</strong><span>Veja linhas válidas, erros de preenchimento e identificadores duplicados.</span></div><div><strong>3. Confirme</strong><span>Somente as linhas válidas são salvas no navegador.</span></div></div></div>${state?importResults(state):''}<p class="tipline">Regras: categoria exatamente como na lista, empresa previamente cadastrada e <span class="kbd">id_externo</span> único por empresa.</p>`}
function importResults(state){let summary=state.rows.reduce((a,r)=>{a[r.result]++;return a},{valid:0,error:0,duplicate:0});let shown=state.rows.slice(0,100);return `<div class="import-results panel"><div class="panel-pad"><div class="head" style="margin:0 0 8px"><div><h2 class="section-title" style="margin:0 0 6px">Pré-visualização da importação</h2><p class="subtitle" style="margin:0">${es(state.fileName)} · ${state.rows.length} linhas analisadas</p></div><div class="file-actions"><button class="btn btn-sm" data-action="download-errors" ${summary.error+summary.duplicate?'':'disabled'}>Baixar relatório de erros</button><button class="btn btn-primary" data-action="confirm-import" ${summary.valid?'':'disabled'}>Importar ${summary.valid} válida(s)</button></div></div><div class="import-summ"><div class="summary-tile"><strong style="color:#167e55">${summary.valid}</strong><small>Válidas</small></div><div class="summary-tile"><strong style="color:#ac4e47">${summary.error}</strong><small>Com erros</small></div><div class="summary-tile"><strong style="color:#9b751b">${summary.duplicate}</strong><small>Duplicadas</small></div></div><div class="notice ${summary.valid?'green':''}">${summary.valid?'Confirme para salvar somente os lançamentos válidos.':'Corrija a planilha e selecione o arquivo novamente.'} ${summary.error+summary.duplicate?'Linhas inválidas ou duplicadas serão ignoradas.':''}</div></div><div class="table-scroll"><table style="min-width:890px"><thead><tr><th>Linha</th><th>ID externo</th><th>Empresa</th><th>Descrição</th><th>Categoria</th><th>Valor</th><th>Resultado</th><th>Detalhes</th></tr></thead><tbody>${shown.map(row=>`<tr><td>${row.line}</td><td>${es(row.data.id_externo||'—')}</td><td>${es(row.data.empresa_codigo||'—')}</td><td>${es(row.data.descricao||'—')}</td><td>${es(row.data.categoria||'—')}</td><td>${Number.isFinite(row.data.valor)?money(row.data.valor):'—'}</td><td><span class="status ${row.result==='valid'?'ok':row.result==='duplicate'?'dup':'error'}">${row.result==='valid'?'Válida':row.result==='duplicate'?'Duplicada':'Erro'}</span></td><td>${row.errors.length?`<span style="color:#ae4a42;font-size:11px">${es(row.errors.join(' · '))}</span>`:'Pronta para importar'}</td></tr>`).join('')}</tbody></table></div>${state.rows.length>100?`<div class="table-info">Exibindo as primeiras 100 de ${state.rows.length} linhas. O processamento considera todas.</div>`:''}</div>`}
function renderCompanies(){return pageHead('Administração','Empresas cadastradas','Cadastre os códigos de empresa antes de importar lançamentos.',`<button class="btn btn-primary" data-action="focus-company">${icon('add')} Cadastrar empresa</button>`)+`<div class="panel panel-pad" style="margin-bottom:18px"><h2 class="section-title">Nova empresa</h2><form id="company-form"><div class="form-grid"><div class="field"><label for="c-code">Código da empresa *</label><input class="control" id="c-code" name="code" maxlength="30" required placeholder="Ex.: EMP004" pattern="[A-Za-z0-9_-]+"/><span class="hint">Sem espaços, até 30 caracteres.</span></div><div class="field"><label for="c-name">Nome da empresa *</label><input class="control" id="c-name" name="name" maxlength="120" minlength="3" required placeholder="Ex.: Mercadinho Central"/></div></div><div class="form-footer"><button type="submit" class="btn btn-primary">Salvar empresa</button></div></form></div><div class="companies-grid">${db.companies.map(c=>{let count=db.entries.filter(x=>x.empresa_codigo===c.code).length;return `<div class="company-card"><span class="company-code">${es(c.code)}</span><strong>${es(c.name)}</strong><small>${c.demo?'Empresa de demonstração · ':'Empresa cadastrada · '}${count} lançamentos</small><div class="company-foot"><span>${count===0?'Sem lançamentos':'Possui movimentações'}</span><button class="text-btn" data-company-delete="${es(c.code)}" ${count?'disabled':''}>Excluir</button></div></div>`}).join('')}</div><div class="notice blue section-space">As empresas <strong>EMP001, EMP002 e EMP003</strong> foram criadas apenas para testar a planilha de exemplos. Você pode cadastrar as empresas reais pelos códigos que desejar.</div>`}
function renderSettings(){return pageHead('Armazenamento','Dados e backup','Gerencie os registros deste ambiente de demonstração.')+`<div class="form-shell"><div class="panel panel-pad"><h2 class="section-title">Cópia de segurança</h2><p class="data-note">Baixe um arquivo JSON para guardar uma cópia das empresas e dos lançamentos. Você também pode restaurar uma cópia neste mesmo navegador.</p><div class="form-footer"><button class="btn btn-primary" data-action="backup">Baixar backup (.json)</button><label class="btn" for="restore-file">Restaurar backup</label><input type="file" accept=".json" id="restore-file" class="hide"></div><div class="sep"></div><h2 class="section-title">Limpar dados de teste</h2><p class="data-note">Apaga todos os lançamentos deste navegador e recria somente as três empresas fictícias de demonstração.</p><div class="form-footer"><button class="btn btn-danger" data-action="reset">Apagar dados locais</button></div></div><div class="panel aside-note"><h3>Sobre esta versão</h3><p>Esta demonstração está acessível pela web, mas os dados permanecem exclusivamente no armazenamento local deste navegador (localStorage). Não há banco de dados remoto nem sincronização entre dispositivos.</p><div class="context-block"><strong>Protótipo web — dados locais</strong><small>Não possui login, PostgreSQL, multiusuário, backup automático ou proteção para dados de clientes reais.</small></div><p>Antes de usar dados reais, será necessário integrar uma API ASP.NET Core, autenticação, PostgreSQL e isolamento por empresa.</p></div></div>`}
function bindPage(){let file=el('excel-file');if(file){file.addEventListener('change',async e=>{if(file.files?.[0])await processFile(file.files[0])});let drop=el('drop-zone');drop.addEventListener('dragover',e=>{e.preventDefault();drop.classList.add('drag')});drop.addEventListener('dragleave',()=>drop.classList.remove('drag'));drop.addEventListener('drop',async e=>{e.preventDefault();drop.classList.remove('drag');if(e.dataTransfer.files?.[0])await processFile(e.dataTransfer.files[0])})}let cat=el('m-cat');if(cat)cat.addEventListener('change',()=>{let c=catByName(cat.value);el('cat-summary').innerHTML=`<strong>${es(c?.grupo||'Selecione uma categoria')}</strong><small>${es(c?.natureza==='ENTRADA'?'Entrada de caixa':c?'Saída de caixa':'O grupo e a natureza aparecem aqui.')}</small>`});let situation=el('m-status');if(situation)situation.addEventListener('change',()=>{let w=el('liquidate-wrap');w.classList.toggle('hide',situation.value==='PENDENTE');let date=el('m-data_liquidacao');if(date){date.required=situation.value==='LIQUIDADO';if(situation.value==='PENDENTE')date.value=''}});let backup=el('restore-file');if(backup)backup.addEventListener('change',async()=>{if(backup.files?.[0])await restoreBackup(backup.files[0])});for(let k of ['q','company','status','group']){let input=el('f-'+k);if(input)input.addEventListener(k==='q'?'input':'change',()=>{queryState[k]=input.value;let entries=listEntries();el('entry-table').innerHTML=listTable(entries);el('entry-count').textContent=`${entries.length} lançamento(s)`})}}
function csvQuote(v){let s=String(v??'');if(/^[=+@-]/.test(s))s="'"+s;return `"${s.replace(/"/g,'""')}"`}
function downloadBlob(content,name,type){let url=URL.createObjectURL(new Blob([content],{type}));let link=document.createElement('a');link.href=url;link.download=name;document.body.append(link);link.click();link.remove();setTimeout(()=>URL.revokeObjectURL(url),2000)}
function exportCSV(){let body=[HEADERS,...listEntries().map(e=>HEADERS.map(k=>k==='valor'?e.valor.toFixed(2).replace('.',','):k.startsWith('data_')?shortDate(e[k]).replace('—',''):e[k]??''))].map(row=>row.map(csvQuote).join(';')).join('\r\n');downloadBlob('\ufeff'+body,'Prosperium_Lancamentos.csv','text/csv;charset=utf-8');showToast('CSV exportado!')}
function downloadErrors(){if(!importSession)return;let rows=[['linha','id_externo','empresa_codigo','resultado','erros']];for(let r of importSession.rows)if(r.result!=='valid')rows.push([r.line,r.data.id_externo||'',r.data.empresa_codigo||'',r.result==='duplicate'?'DUPLICADO':'ERRO',r.errors.join(' | ')]);let csv='\ufeff'+rows.map(x=>x.map(csvQuote).join(';')).join('\r\n');downloadBlob(csv,'Prosperium_Relatorio_Importacao.csv','text/csv;charset=utf-8');showToast('Relatório de problemas exportado.')}
function handleDelete(id){let e=db.entries.find(x=>x.id===id);if(!e)return;if(!confirm(`Excluir o lançamento "${e.descricao}"?`))return;db.entries=db.entries.filter(x=>x.id!==id);if(saveDb()){showToast('Lançamento excluído.');render()}}
function saveCompany(form){let data=Object.fromEntries(new FormData(form));let code=(data.code||'').trim().toUpperCase(),name=(data.name||'').trim();if(!/^[A-Z0-9_-]{2,30}$/.test(code)){showToast('Código inválido (2 a 30 caracteres, letras, números, _ ou -).','error');return}if(name.length<3){showToast('Informe um nome com pelo menos 3 caracteres.','error');return}if(companyByCode(code)){showToast('Este código já está cadastrado.','error');return}db.companies.push({code,name,demo:false});if(saveDb()){showToast('Empresa cadastrada!');render()}}
function deleteCompany(code){let c=companyByCode(code);if(!c||db.entries.some(e=>e.empresa_codigo===code))return;if(!confirm(`Excluir a empresa ${c.name} (${c.code})?`))return;db.companies=db.companies.filter(x=>x.code!==code);if(saveDb()){showToast('Empresa excluída.');render()}}
function confirmImport(){if(!importSession)return;let valid=importSession.rows.filter(r=>r.result==='valid');if(!valid.length)return;let now=new Date().toISOString();let incoming=valid.map(r=>({...r.data,id:uid(),origin:'EXCEL',createdAt:now}));db.entries.push(...incoming);if(!saveDb()){db.entries.splice(-incoming.length);return}let count=incoming.length;importSession=null;showToast(`${count} lançamento(s) importado(s) com sucesso!`);activePage='entries';render()}
async function restoreBackup(file){try{if(file.size>10*1024*1024)throw Error('Arquivo muito grande.');let d=JSON.parse(await file.text());if(!d||!Array.isArray(d.companies)||!Array.isArray(d.entries)||d.companies.some(c=>!c.code||!c.name)||d.entries.some(e=>!e.id||!e.empresa_codigo))throw Error('Formato de backup inválido.');if(!confirm(`Restaurar ${d.entries.length} lançamentos? Isso substituirá todos os dados atuais deste navegador.`))return;let old=db;db=d;if(!saveDb()){db=old;return}showToast('Backup restaurado com sucesso.');navigate('dashboard')}catch(e){showToast(`Falha ao restaurar backup: ${e.message}`,'error')}}
// Reader XLSX minimalista: formato OOXML/ZIP sem servidor ou bibliotecas externas.
async function unzipEntries(file){const buf=await file.arrayBuffer(),v=new DataView(buf),bytes=new Uint8Array(buf),dec=new TextDecoder('utf-8');const read16=o=>v.getUint16(o,true),read32=o=>v.getUint32(o,true);let eocd=-1;for(let i=buf.byteLength-22;i>=Math.max(0,buf.byteLength-65557);i--){if(read32(i)===0x06054b50){eocd=i;break}}if(eocd<0)throw Error('Arquivo não está no formato .xlsx válido (ZIP).');let count=read16(eocd+10),position=read32(eocd+16),out=new Map();if(count>1500)throw Error('Arquivo possui partes internas em excesso.');for(let i=0;i<count;i++){if(position+46>buf.byteLength||read32(position)!==0x02014b50)throw Error('Arquivo Excel danificado.');let method=read16(position+10),packed=read32(position+20),unpacked=read32(position+24),nameLen=read16(position+28),extra=read16(position+30),comment=read16(position+32),local=read32(position+42);let name=dec.decode(bytes.slice(position+46,position+46+nameLen));if(unpacked>30*1024*1024)throw Error('Parte interna do Excel muito grande.');let len=read16(local+26),ex=read16(local+28),offset=local+30+len+ex;if(offset+packed>buf.byteLength)throw Error('Arquivo Excel truncado.');out.set(name,async()=>{let source=bytes.slice(offset,offset+packed),raw;if(method===0)raw=source;else if(method===8){if(typeof DecompressionStream==='undefined')throw Error('Seu navegador não suporta descompactar Excel. Use Chrome ou Edge atualizado.');let stream=new Blob([source]).stream().pipeThrough(new DecompressionStream('deflate-raw'));raw=new Uint8Array(await new Response(stream).arrayBuffer());}else throw Error('Método de compactação Excel incompatível.');if(raw.length>30*1024*1024)throw Error('Conteúdo Excel maior que o permitido.');return dec.decode(raw)});position+=46+nameLen+extra+comment;}return out}
function parseXML(str){let doc=new DOMParser().parseFromString(str,'application/xml');if(doc.getElementsByTagName('parsererror').length)throw Error('XML do Excel inválido.');return doc}
function xmlEls(root,tag){return Array.from(root.getElementsByTagNameNS('*',tag))}
function xmlText(root,tag){return xmlEls(root,tag).map(e=>e.textContent||'').join('')}
function dirnamePath(p){return p.slice(0,p.lastIndexOf('/')+1)}
function resolveXlsxPath(base,target){if(target.startsWith('/'))return target.slice(1);let stack=base.split('/').filter(Boolean);for(let part of target.split('/')){if(part==='..')stack.pop();else if(part&&part!=='.')stack.push(part)}return stack.join('/')}
async function parseWorkbook(file){const zip=await unzipEntries(file);async function get(path){let found=zip.get(path);if(!found)throw Error(`Estrutura Excel incompleta: ${path}`);return parseXML(await found())}
 const workbook=await get('xl/workbook.xml'),rels=await get('xl/_rels/workbook.xml.rels');let sheet=xmlEls(workbook,'sheet').find(n=>n.getAttribute('name')==='IMPORTAR_LANCAMENTOS');if(!sheet)throw Error('Aba IMPORTAR_LANCAMENTOS não encontrada. Use o modelo oficial.');let relId=sheet.getAttribute('r:id')||sheet.getAttributeNS('http://schemas.openxmlformats.org/officeDocument/2006/relationships','id');let rel=xmlEls(rels,'Relationship').find(n=>n.getAttribute('Id')===relId);if(!rel)throw Error('Não foi possível localizar a aba de importação.');let target=resolveXlsxPath('xl',rel.getAttribute('Target'));const doc=await get(target);
 let shared=[];if(zip.has('xl/sharedStrings.xml')){let ss=await get('xl/sharedStrings.xml');shared=xmlEls(ss,'si').map(si=>xmlText(si,'t'));}
 let data=[];for(let row of xmlEls(doc,'row')){let rowNum=Number(row.getAttribute('r'))||data.length+1,values=Array(HEADERS.length).fill('');for(let c of xmlEls(row,'c')){let ref=c.getAttribute('r')||'',letters=ref.match(/^([A-Z]+)/)?.[1],col=0;if(!letters)continue;for(let ch of letters)col=col*26+(ch.charCodeAt(0)-64);col--;if(col>=HEADERS.length)continue;let t=c.getAttribute('t'),v=xmlEls(c,'v')[0]?.textContent??'';if(t==='s')values[col]=shared[Number(v)]??'';else if(t==='inlineStr')values[col]=xmlText(c,'t');else if(t==='b')values[col]=v==='1';else if(t==='str'||t==='e')values[col]=v;else values[col]=v!==''&&Number.isFinite(Number(v))?Number(v):v;}if(rowNum===1){for(let j=0;j<HEADERS.length;j++)if(String(values[j]??'').trim()!==HEADERS[j])throw Error(`Cabeçalho ${j+1} incorreto: esperado "${HEADERS[j]}".`)}else if(values.some(x=>String(x??'').trim()!=='')){if(data.length>=5000)throw Error('Limite de 5.000 lançamentos por arquivo excedido.');let obj={};HEADERS.forEach((h,j)=>obj[h]=values[j]);data.push({line:rowNum,raw:obj});}}
 if(!xmlEls(doc,'row').some(r=>r.getAttribute('r')==='1'))throw Error('O arquivo não possui os cabeçalhos na primeira linha.');return data;
}
async function processFile(file){try{if(!file.name.toLowerCase().endsWith('.xlsx'))throw Error('Escolha um arquivo .xlsx.');if(file.size>10*1024*1024)throw Error('Arquivo excede 10 MB.');let rows=await parseWorkbook(file);if(!rows.length)throw Error('A aba IMPORTAR_LANCAMENTOS não possui lançamentos. Confira a aba EXEMPLOS para orientar o preenchimento.');let existing=new Set(db.entries.filter(e=>e.id_externo).map(e=>`${e.empresa_codigo}\u0000${e.id_externo}`)),seen=new Set();let results=[];for(let row of rows){let {data,errors}=validateEntry(row.raw,'import');let duplicate=false,externalKey=`${data.empresa_codigo}\u0000${data.id_externo}`;if(data.id_externo&&data.empresa_codigo){if(existing.has(externalKey)||seen.has(externalKey))duplicate=true;else if(!errors.length)seen.add(externalKey);}results.push({line:row.line,data,errors:duplicate?['ID externo já importado ou repetido no arquivo.']:errors,result:duplicate?'duplicate':errors.length?'error':'valid'});}importSession={fileName:file.name,rows:results};render();showToast('Excel analisado. Confira a pré-visualização antes de importar.');}catch(e){importSession=null;render();showToast(`Não foi possível ler o Excel: ${e.message}`,'error');}}
// Delegação de eventos (funciona após navegação sem reatribuir listeners).
document.addEventListener('click',ev=>{let btn=ev.target.closest('[data-page],[data-action],[data-edit],[data-delete],[data-company-delete]');if(!btn)return;if(btn.dataset.page){navigate(btn.dataset.page);return}if(btn.dataset.edit){selectedEdit=btn.dataset.edit;activePage='add';render();scrollTo({top:0,behavior:'instant'});return}if(btn.dataset.delete){handleDelete(btn.dataset.delete);return}if(btn.dataset.companyDelete){deleteCompany(btn.dataset.companyDelete);return}let action=btn.dataset.action;switch(action){case 'confirm-import':confirmImport();break;case 'download-errors':downloadErrors();break;case 'export-csv':exportCSV();break;case 'download-template':{let bin=atob(TEMPLATE_B64);let arr=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)arr[i]=bin.charCodeAt(i);downloadBlob(arr,'Prosperium_Modelo_Cadastro_Importacao.xlsx','application/vnd.openxmlformats-officedocument.spreadsheetml.sheet');showToast('Modelo Excel baixado.');break;}case 'backup':downloadBlob(JSON.stringify(db,null,2),'Prosperium_Backup.json','application/json;charset=utf-8');showToast('Backup exportado.');break;case 'reset':if(confirm('Apagar TODOS os lançamentos e empresas salvos neste navegador?')){db=deepCopy(INITIAL);saveDb();importSession=null;selectedEdit=null;showToast('Dados reiniciados.');navigate('dashboard')}break;case 'focus-company':el('c-code')?.focus();break;}});
document.addEventListener('submit',ev=>{if(ev.target.id==='entry-form'){ev.preventDefault();saveEntryFromForm(ev.target)}else if(ev.target.id==='company-form'){ev.preventDefault();saveCompany(ev.target)}});
// Para testes automáticos sem expor conteúdo financeiro fora do navegador.
window.ProsperiumTest={getState:()=>deepCopy(db),parseWorkbook,validateEntry,calculateStats};
render();
</script>
