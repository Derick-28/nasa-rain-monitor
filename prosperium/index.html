const isDateISO=v=>{const m=String(v||'').match(/^(\d{4})-(\d{2})-(\d{2})$/);if(!m)return false;const d=new Date(Date.UTC(+m[1],+m[2]-1,+m[3]));return d.getUTCFullYear()===+m[1]&&d.getUTCMonth()+1===+m[2]&&d.getUTCDate()===+m[3]};
function dateFromText(s){if(!s&&s!==0)return '';if(typeof s==='number'){if(!Number.isFinite(s)||s<1||s>2958465)return '';let d=new Date(Date.UTC(1899,11,30)+Math.round(s*86400000));return Number.isNaN(d.getTime())?'':d.toISOString().slice(0,10)}let t=String(s).trim();if(isDateISO(t))return t;let a=t.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})$/);if(a){let v=`${a[3]}-${a[2].padStart(2,'0')}-${a[1].padStart(2,'0')}`;return isDateISO(v)?v:''}return ''}
function valueNumber(v){if(typeof v==='number')return Number.isFinite(v)?v:NaN;const s=String(v??'').trim().replace(/\s|R\$/g,'');if(!s)return NaN;let z=s.includes(',')?s.replace(/\./g,'').replace(',','.'):s;return Number(z)}
function dateInMonth(delta,day){const d=new Date();const v=new Date(d.getFullYear(),d.getMonth()+delta,Math.min(day,27));return [v.getFullYear(),String(v.getMonth()+1).padStart(2,'0'),String(v.getDate()).padStart(2,'0')].join('-')}

function authLogin(email,pass){const account=ACCOUNTS.find(a=>a.email.toLowerCase()===String(email||'').trim().toLowerCase()&&a.password===pass);if(!account)return false;sessionStorage.setItem(SESSION_KEY,account.email);active='dashboard';companyFilter='';monthFilter='';render();return true}

function scopedEntries(options={}){const u=currentUser();if(!u)return[];return db.entries.filter(e=>{
 if(u.role==='client'&&e.empresa_codigo!==clientCode())return false;

function categoryChart(entries){let arr={};for(const e of entries)if(e.situacao==='LIQUIDADO'&&categoryNature(e.categoria)==='SAIDA'){let group=catByName(e.categoria)?.grupo||'Outras';arr[group]=(arr[group]||0)+Number(e.valor)}let sorted=Object.entries(arr).sort((a,b)=>b[1]-a[1]);const total=sorted.reduce((a,x)=>a+x[1],0),colors=['#ffd15e','#3b9cef','#4e7baa','#92a8bb','#d49a35','#d88b7a'];let from=0;const segments=sorted.map(([label,v],i)=>{const start=from;from+=v/Math.max(total,1)*100;return{label,v,color:colors[i%colors.length],start,end:from}});let css=segments.length?`conic-gradient(${segments.map(s=>`${s.color} ${s.start}% ${s.end}%`).join(', ')})`:'conic-gradient(#29445e 0 100%)';return `<div class="donut-wrap"><div class="donut" style="background:${css}"><div class="donut-hole"><div>${moneyShort(total)}<div class="tiny muted">Despesas pagas</div></div></div></div><div class="legend">${segments.length?segments.slice(0,5).map(s=>`<div class="legend-item"><span><i class="dot" style="background:${s.color}"></i>${escapeHTML(s.label)}</span><strong>${Math.round(s.v/total*100)}%</strong></div>`).join(''):'<span class="muted">Nenhuma saída liquidada no período.</span>'}</div></div>`}

async function unzipEntries(file){const buf=await file.arrayBuffer(),v=new DataView(buf),bytes=new Uint8Array(buf),dec=new TextDecoder('utf-8');const read16=o=>v.getUint16(o,true),read32=o=>v.getUint32(o,true);let eocd=-1;for(let i=buf.byteLength-22;i>=Math.max(0,buf.byteLength-65557);i--){if(read32(i)===0x06054b50){eocd=i;break}}if(eocd<0)throw Error('Arquivo não está no formato .xlsx válido (ZIP).');let count=read16(eocd+10),position=read32(eocd+16),out=new Map();if(count>1500)throw Error('Arquivo possui partes internas em excesso.');for(let i=0;i<count;i++){if(position+46>buf.byteLength||read32(position)!==0x02014b50)throw Error('Arquivo Excel danificado.');let method=read16(position+10),packed=read32(position+20),unpacked=read32(position+24),nameLen=read16(position+28),extra=read16(position+30),comment=read16(position+32),local=read32(position+42);let name=dec.decode(bytes.slice(position+46,position+46+nameLen));if(unpacked>30*1024*1024)throw Error('Parte interna do Excel muito grande.');let len=read16(local+26),ex=read16(local+28),offset=local+30+len+ex;if(offset+packed>buf.byteLength)throw Error('Arquivo Excel truncado.');out.set(name,async()=>{let source=bytes.slice(offset,offset+packed),raw;if(method===0)raw=source;else if(method===8){if(typeof DecompressionStream==='undefined')throw Error('Seu navegador não suporta descompactar Excel. Use Chrome ou Edge atualizado.');let stream=new Blob([source]).stream().pipeThrough(new DecompressionStream('deflate-raw'));raw=new Uint8Array(await new Response(stream).arrayBuffer());}else throw Error('Método de compactação Excel incompatível.');if(raw.length>30*1024*1024)throw Error('Conteúdo Excel maior que o permitido.');return dec.decode(raw)});position+=46+nameLen+extra+comment;}return out}
function parseXML(str){let doc=new DOMParser().parseFromString(str,'application/xml');if(doc.getElementsByTagName('parsererror').length)throw Error('XML do Excel inválido.');return doc}
function xmlEls(root,tag){return Array.from(root.getElementsByTagNameNS('*',tag))}
function xmlText(root,tag){return xmlEls(root,tag).map(e=>e.textContent||'').join('')}
function dirnamePath(p){return p.slice(0,p.lastIndexOf('/')+1)}
function resolveXlsxPath(base,target){if(target.startsWith('/'))return target.slice(1);let stack=base.split('/').filter(Boolean);for(let part of target.split('/')){if(part==='..')stack.pop();else if(part&&part!=='.')stack.push(part)}return stack.join('/')}
async function parseWorkbook(file){const zip=await unzipEntries(file);async function get(path){let found=zip.get(path);if(!found)throw Error(`Estrutura Excel incompleta: ${path}`);return parseXML(await found())}
 const workbook=await get('xl/workbook.xml'),rels=await get('xl/_rels/workbook.xml.rels');let sheet=xmlEls(workbook,'sheet').find(n=>n.getAttribute('name')==='IMPORTAR_LANCAMENTOS');if(!sheet)throw Error('Aba IMPORTAR_LANCAMENTOS não encontrada. Use o modelo oficial.');let relId=sheet.getAttribute('r:id')||sheet.getAttributeNS('http://schemas.openxmlformats.org/officeDocument/2006/relationships','id');let rel=xmlEls(rels,'Relationship').find(n=>n.getAttribute('Id')===relId);if(!rel)throw Error('Não foi possível localizar a aba de importação.');let target=resolveXlsxPath('xl',rel.getAttribute('Target'));const doc=await get(target);
 let shared=[];if(zip.has('xl/sharedStrings.xml')){let ss=await get('xl/sharedStrings.xml');shared=xmlEls(ss,'si').map(si=>xmlText(si,'t'));}
 let data=[];for(let row of xmlEls(doc,'row')){let rowNum=Number(row.getAttribute('r'))||data.length+1,values=Array(HEADERS.length).fill('');for(let c of xmlEls(row,'c')){let ref=c.getAttribute('r')||'',letters=ref.match(/^([A-Z]+)/)?.[1],col=0;if(!letters)continue;for(let ch of letters)col=col*26+(ch.charCodeAt(0)-64);col--;if(col>=HEADERS.length)continue;let t=c.getAttribute('t'),v=xmlEls(c,'v')[0]?.textContent??'';if(t==='s')values[col]=shared[Number(v)]??'';else if(t==='inlineStr')values[col]=xmlText(c,'t');else if(t==='b')values[col]=v==='1';else if(t==='str'||t==='e')values[col]=v;else values[col]=v!==''&&Number.isFinite(Number(v))?Number(v):v;}if(rowNum===1){for(let j=0;j<HEADERS.length;j++)if(String(values[j]??'').trim()!==HEADERS[j])throw Error(`Cabeçalho ${j+1} incorreto: esperado "${HEADERS[j]}".`)}else if(values.some(x=>String(x??'').trim()!=='')){if(data.length>=5000)throw Error('Limite de 5.000 lançamentos por arquivo excedido.');let obj={};HEADERS.forEach((h,j)=>obj[h]=values[j]);data.push({line:rowNum,raw:obj});}}
 if(!xmlEls(doc,'row').some(r=>r.getAttribute('r')==='1'))throw Error('O arquivo não possui os cabeçalhos na primeira linha.');return data;
}
